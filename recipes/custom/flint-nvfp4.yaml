# Recipe: Recursive Flint NVFP4 (ModelOpt safetensors)
# Community NVFP4 W4A4 quantization of RecursiveSI/flint (40B-A2.5B MoE for coding
# agents) by FutureMLS-Lab, in standard NVIDIA ModelOpt NVFP4 format (routed
# experts of MoE layers 2-48 are NVFP4; attention, routers, shared experts,
# dense layers 0-1, embeddings and lm_head stay BF16). ~23.5 GB of weights.
#
# Requirements / caveats:
# - The container's vLLM must include Flint architecture support
#   (vllm-project/vllm PR #62938, merged 2026-10-22). This repo's default build
#   (vllm-node, VLLM_REF=main) provides it. eugr/spark-vllm:latest
#   (nightly-20261016) predates Flint and CANNOT serve this model; the Nov-6+
#   vllm-node nightlies do (see STATUS below).
#
# STATUS (verified Nov-7 on TARS):
# - vllm-node:latest (vllm 0.33.0rc1.dev1016+g06129ab02.d20261107) registers
#   FlintForCausalLM (vllm.models.flint.model) and resolves the checkpoint to
#   it with quantization=modelopt_fp4 autodetected, so no --quantization flag.
# - KV cache must stay BF16: FlintAttention asserts
#   kv_cache_dtype in ("auto", "bfloat16") (vllm/models/flint/model.py:322),
#   so --kv-cache-dtype fp8 aborts engine startup with a bare AssertionError.
#   Same constraint as the Ripple recipe, and the official GB200 recipe also
#   validated BF16 KV. Budget instead: 14 full-attention layers x 4 kv-heads
#   x 128 head_dim x 2 x 2 B = 28 KB/token (~3.7 GB at 131072 ctx); the 35
#   sliding-window layers are capped at window 513 (~184 MB/seq at full
#   window), so BF16 KV is affordable next to ~23.5 GB of weights.
# - This checkpoint was validated by its author on SGLang/B300, not on vLLM.
#   Treat this recipe as experimental; the launch flags follow the official vLLM
#   Flint recipe (recipes.vllm.ai/RecursiveSI/flint) adapted to the ModelOpt path.
# - The checkpoint ships its own config.json, tokenizer, chat template and
#   generation config, so no files are needed from the BF16 RecursiveSI/flint
#   repo and no gguf package is required.
# - Official sampling defaults: temperature 1.0, top_p 0.95, top_k 20 (they come
#   from generation_config.json). Hard problems want >= 32768 output tokens.

recipe_version: "1"
name: Flint-NVFP4
description: vLLM serving FutureMLS-Lab/flint-nvfp4-coldgptq (ModelOpt NVFP4 W4A4 MoE experts) with Marlin MoE backend

# HuggingFace model to download (optional, for --download-model)
model: FutureMLS-Lab/flint-nvfp4-coldgptq

# Container image to use (must be built from a vLLM ref >= 2026-10-22 main)
container: vllm-node

# 23.5 GB of weights fit comfortably on a single DGX Spark; Flint's optimized
# path is TP=1 and the official recipe does not validate TP>1.
solo_only: true

# No mods needed: no GGUF loader, no custom code in the checkpoint.
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  # Documented context is 262144; 131072 is the conservative single-Spark
  # default. Raise with --max-model-len 262144 after checking KV headroom.
  max_model_len: 131072
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  # Single generic served name: the checkpoint id carries the quantization
  # and the repackager (FutureMLS-Lab/...-nvfp4-coldgptq), which is noise for
  # clients, benchmarks and Prometheus metrics, and "flint" matches the
  # official https://recipes.vllm.ai/RecursiveSI/flint examples too.
  #
  # The naming authority is the dashboard: ai-models-launcher's
  # config/model-mappings.json has a "flint.*" rule resolving to
  # servedModelName "flint", which makes it (a) append
  # "-- --served-model-name flint" when starting the container
  # (src/application/model/commands/StartModelCommand.ts) and (b) benchmark
  # with '--served-model-name "flint" --tokenizer "FutureMLS-Lab/..."'
  # (src/app/api/nodes/.../benchmark/route.ts). Keep this value equal to that
  # mapping: the launcher flag arrives after this one and argparse keeps the
  # last occurrence of --served-model-name.
  #
  # Benching a server started by hand (no launcher, so only "flint" answers)
  # must send the tokenizer path explicitly, otherwise it fails with:
  #   NotFoundError: The model `FutureMLS-Lab/flint-nvfp4-coldgptq` does not
  #   exist. Valid aliases: flint.
  #   uv run llama-benchy --base-url http://localhost:8000/v1 \
  #     --model FutureMLS-Lab/flint-nvfp4-coldgptq --served-model-name flint \
  #     --pp 2048 --tg 32 --depth 4096 8192 --enable-prefix-caching \
  #     --concurrency 1 4 --latency-mode generation --format md
  # Or omit --model: llama-benchy then auto-detects both served id and
  # tokenizer root from /v1/models (verified: "Auto-detected HF model:
  # FutureMLS-Lab/flint-nvfp4-coldgptq (served as: flint)").
  # llama-benchy 0.3.5 has no --exact-tg flag; check the version you are on.
  served_model_name: flint

# Environment variables
env:
  # Flint is not supported by vLLM's Rust frontend yet (it rejects the
  # --exclude-tools-when-tool-choice-none flag); keep the Python frontend.
  VLLM_USE_RUST_FRONTEND: 0
  # Matches the other NVFP4-on-Marlin recipes in this repo.
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

# The vLLM serve command template.
# Parsers follow the official Flint recipe: glm47 for both reasoning and tool
# calls (deepseek_v3 is wrong for Flint: reasoning would stay in content).
# No --kv-cache-dtype: Flint only accepts auto/bfloat16 KV (asserted during
# model construction), so BF16 KV is the only option, not a preference.
command: |
  vllm serve FutureMLS-Lab/flint-nvfp4-coldgptq \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --moe-backend marlin \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser glm47 \
    --reasoning-parser glm47 \
    --exclude-tools-when-tool-choice-none
