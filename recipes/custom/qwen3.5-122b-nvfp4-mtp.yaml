   recipe_version: "1"
   name: Qwen3.5-122B-NVFP4
   description: vLLM serving Sehyo/Qwen3.5-122B-A10B-NVFP4 on GB10 with B12X stack

   model: Sehyo/Qwen3.5-122B-A10B-NVFP4
   container: vllm-node-b12x

   build_args:
     - --exp-b12x

   cluster_only: false

   mods:
     - mods/instanttensor-hybrid-draft-loader
     - mods/fix-qwen3.5-chat-template

   defaults:
     port: 8000
     host: 0.0.0.0
     tensor_parallel: 2
     gpu_memory_utilization: 0.8
     max_model_len: 262144
     max_num_seqs: 8
     max_num_batched_tokens: 8192
     max_cudagraph_capture_size: 64
     block_size: 256
     num_speculative_tokens: 3
     served_model_name: Qwen3.5-122B-A10B

   env:
     CUTE_DSL_ARCH: "sm_121a"
     VLLM_USE_AOT_COMPILE: "1"
     VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
     VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
     VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
     VLLM_USE_FLASHINFER_SAMPLER: "1"
     VLLM_USE_B12X_WO_PROJECTION: "1"
     VLLM_USE_B12X_MHC: "1"
     VLLM_USE_B12X_FP8_GEMM: "1"
     VLLM_USE_B12X_MOE: "1"
     VLLM_USE_B12X_SPARSE_INDEXER: "1"
     VLLM_USE_V2_MODEL_RUNNER: "1"
     VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
   command: |
     vllm serve Sehyo/Qwen3.5-122B-A10B-NVFP4 \
         --host {host} \
         --port {port} \
         --trust-remote-code \
         --served-model-name {served_model_name} \
         --tensor-parallel-size {tensor_parallel} \
         --kv-cache-dtype fp8 \
         --block-size {block_size} \
         --max-model-len {max_model_len} \
         --kernel-config '{{"enable_flashinfer_autotune":false}}' \
         --max-num-seqs {max_num_seqs} \
         --max-num-batched-tokens {max_num_batched_tokens} \
         --gpu-memory-utilization {gpu_memory_utilization} \
         --enable-prefix-caching \
         --enable-chunked-prefill \
         --async-scheduling \
         --load-format instanttensor \
         --moe-backend b12x \
         --max-cudagraph-capture-size {max_cudagraph_capture_size} \
         --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
         --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"draft_tensor_parallel_size":1}}' \
         --reasoning-parser qwen3 \
         --tool-call-parser qwen3_xml \
         --enable-auto-tool-choice \
         --chat-template unsloth.jinja